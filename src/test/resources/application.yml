spring:
  application:
    name: LocalFestival-Test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      timeout: 3000ms

  flyway:
    enabled: false

server:
  port: 8080

jwt:
  secret:
    key: "c2lsdmVybGluZS10ZXN0LWp3dC1zZWNyZXQta2V5LXZhbHVlLWZvci1sb2NhbC1mZXN0aXZhbA"

external:
  api:
    festival:
      url: http://localhost:8080/dummy-api
      key: "dummy-festival-api-key"
    tour:
      url: http://localhost:8080/dummy-api
      key: "dummy-tour-api-key"

logging:
  level:
    root: INFO