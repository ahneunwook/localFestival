version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres-local
    restart: always
    ports:
      - "${LOCAL_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME}
      POSTGRES_USER: ${LOCAL_DB_USERNAME}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: redis-local
    restart: always
    ports:
      - "${LOCAL_REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${LOCAL_REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      - TZ=Asia/Seoul
    volumes:
      - redisdata-local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LOCAL_REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata-local:
  redisdata-local: