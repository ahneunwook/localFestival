# Path-based auto labels for pull requests (actions/labeler)
feature:
  - 'front/**'
  - 'src/**/components/**'
  - 'src/**/*.tsx'
  - 'src/**/*.ts'
  - 'src/**/*.js'
  - 'src/**/*.jsx'
backend:
  - 'src/main/**'
  - 'src/**/controller/**'
  - 'src/**/service/**'
  - 'src/**/repository/**'
  - 'pom.xml'
  - 'build.gradle*'
bug:
  - '**/fix/**'
  - '**/*hotfix*'
docs:
  - '**/*.md'
  - 'docs/**'
  - 'wiki/**'
test:
  - '**/*Test.java'
  - '**/__tests__/**'
  - '**/*.spec.*'
  - '**/*.test.*'
ci:
  - '.github/workflows/**'
