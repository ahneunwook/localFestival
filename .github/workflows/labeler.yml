# actions/labeler@v5 config (new schema)
feature:
  - changed-files:
      - any-glob-to-any-file: 
          - 'front/**'
          - 'src/**/components/**'
          - 'src/**/*.tsx'
          - 'src/**/*.ts'
          - 'src/**/*.js'
          - 'src/**/*.jsx'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/main/**'
          - 'src/**/controller/**'
          - 'src/**/service/**'
          - 'src/**/repository/**'
          - 'pom.xml'
          - 'build.gradle*'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
          - 'wiki/**'

test:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*Test.java'
          - '**/__tests__/**'
          - '**/*.spec.*'
          - '**/*.test.*'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'

design:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.css'
          - '**/*.scss'
          - '**/*.sass'
          - '**/*.less'
          - 'src/**/styles/**'
          - 'public/**/*.svg'
          - 'public/**/*.png'
          - 'public/**/*.jpg'
