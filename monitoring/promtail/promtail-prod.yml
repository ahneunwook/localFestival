server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://OBS_EC2_PRIVATE_IP:3100/loki/api/v1/push

scrape_configs:
  - job_name: spring-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: spring
          host: app-ec2
          __path__: /var/log/festival/*.log

    pipeline_stages:
      - regex:
          expression: ".*TraceId:(?P<traceId>[a-zA-Z0-9\\-]+).*"
      - labels:
          traceId:
